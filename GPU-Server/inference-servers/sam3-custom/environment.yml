# SAM3 server environment (sam3_env)
# Pinned to the versions verified working on an NVIDIA A100 (CUDA 12.1 build of PyTorch).
#
# Usage (from inside image-editing/sam3/, after copying this file in):
#   conda env create -f environment.yml
#   conda activate sam3_env
#   pip install -e .
#   python SAM3_server.py        # port 5007
#
# Requirements: Linux x86_64, NVIDIA GPU, driver supporting CUDA 12.1 or newer.
name: sam3_env
channels:
  - pytorch
  - defaults
  - nvidia
  - conda-forge
dependencies:
  - python=3.10.19
  - pip=25.3
  - setuptools=80.9.0
  - wheel=0.45.1

  # PyTorch (conda build, CUDA 12.1)
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - mkl=2022.1.0
  - libjpeg-turbo=3.1.2
  - libtiff=4.7.1
  - llvm-openmp=15.0.7

  # Server and utilities
  - flask=3.1.2
  - flask-cors=6.0.1
  - pillow=12.0.0
  - pyyaml=6.0.3
  - requests=2.32.5
  - networkx=3.4.2
  - ffmpeg=4.4.2

  - pip:
      - accelerate==1.12.0
      - anyio==4.12.0
      - exceptiongroup==1.3.1
      - fsspec==2025.12.0
      - ftfy==6.1.1
      - h11==0.16.0
      - hf-xet==1.2.0
      - httpcore==1.0.9
      - httpx==0.28.1
      - huggingface-hub==1.3.0
      - iopath==0.1.10
      - numpy==1.26.4
      - opencv-python==4.10.0.84
      - packaging==25.0
      - portalocker==4.4.0
      - psutil==7.1.3
      - regex==2025.11.3
      - safetensors==0.7.0
      - shellingham==1.5.4
      - sympy==1.13.1
      - timm==1.0.30
      - tokenizers==0.22.1
      - tqdm==4.67.1
      - transformers==5.0.0
      - typer-slim==0.20.0
      - wcwidth==0.9.1
      # sam3 itself is NOT listed here; it is installed afterwards with `pip install -e .`
