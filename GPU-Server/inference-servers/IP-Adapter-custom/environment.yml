# IP-Adapter depth re-rendering / harmonization server (ip_adapter_env)
# Pinned to the versions verified working on an NVIDIA A100 (PyTorch 2.5.1 + CUDA 12.1).
#
# Usage (from inside image-editing/IP-Adapter/, after copying this file in):
#   conda env create -f environment.yml
#   conda activate ip_adapter_env
#   python depth_rerender.py        # port 5003
#
# Requirements: Linux x86_64, NVIDIA GPU, driver supporting CUDA 12.1 or newer.
name: ip_adapter_env
channels:
  - conda-forge
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.7.22
  - icu=78.3
  - ld_impl_linux-64=2.46.1
  - libexpat=2.8.5
  - libffi=3.7.0
  - libgcc=16.2.0
  - libgomp=16.2.0
  - liblzma=5.8.3
  - libnsl=2.0.1
  - libsqlite=3.53.4
  - libstdcxx=16.2.0
  - libuuid=2.42.4
  - libxcrypt=4.4.38
  - libzlib=1.3.2
  - ncurses=6.6
  - openssl=3.6.4
  - packaging=26.3
  - pip=26.2.1
  - python=3.10.21
  - readline=8.3
  - setuptools=84.0.0
  - tk=8.6.13
  - tzdata=2026c
  - wheel=0.48.0
  - zstd=1.5.7
  - pip:
      # CUDA 12.1 builds of PyTorch come from the PyTorch download index
      - --extra-index-url https://download.pytorch.org/whl/cu121
